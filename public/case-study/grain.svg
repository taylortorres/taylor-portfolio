<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Figma "Noise" effect (monotone, size 0.5, density 1, #FAFAFC at 12%), same recipe as Figma's SVG export of the cursor dot. Tiles seamlessly. -->
  <filter id="n" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="2" numOctaves="3" seed="713" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="luminanceToAlpha" result="alphaNoise" />
    <feComponentTransfer in="alphaNoise" result="mask">
      <feFuncA type="discrete" tableValues="1 0" />
    </feComponentTransfer>
    <feFlood flood-color="#FAFAFC" flood-opacity="0.12" />
    <feComposite in2="mask" operator="in" />
  </filter>
  <rect width="128" height="128" filter="url(#n)" />
</svg>
